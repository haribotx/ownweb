<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Botx Automations</title>
    <style>
     html, body {
    background-color: #000;
    color: #fff;
    margin: 0;
    padding: 0;
  }
  </style>
  <link rel="stylesheet" href="blog.css" />
  <link rel="icon" type="image/png" href="/frontend/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">


</head>
<body>
  <!-- Header -->
  <header>
    <div id="header-placeholder"></div>
  </header>

  <!-- Blog Section -->
  <section class="blog-section">
    <div class="container">
      <h2 class="section-title">Creative <span class="section-title-span">Work</span></h2>
      <div class="blog-grid">
        <!-- Blog cards will be injected here -->
      </div>
    </div>
  </section>

  <section class="">
    <div class="head-section"  id="filter-section">
      <button class="filter-item active" data-category="all">All</button>
      <button class="filter-item" data-category="webapp">Web App</button>
      <button class="filter-item " data-category="website">Website</button>
      <button class="filter-item" data-category="custom">Custom Sas Product</button>

      </div>
    </div>
  </section>
  <script>
  const filterItems = document.querySelectorAll('.filter-item');

  filterItems.forEach(item => {
    item.addEventListener('click', () => {
      // Remove active from all
      filterItems.forEach(i => i.classList.remove('active'));
      
      // Add active to clicked
      item.classList.add('active');

    
      const selected = item.textContent.trim();

      // Example: you can call your filtering logic here
      // filterBlogs(selected);
    });
  });

</script>

<section class="blogs" id="blog-container">

</section>

<div id="footer-placeholder"></div>

 <script src="./includeHeader.js"></script>
  <script src="./includeFooter.js"></script>
<script src="config.js"></script>
  <script src="blog.js"></script>
</body>
</html>
