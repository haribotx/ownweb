<body>
      <header>
  </header>

  <!-- Work Section -->
  <section class="blog-section">
    <div class="container">
      <h2 class="section-title">Showcasing  <span class="section-title-span">Design Thinking</span>
        And User <span class="section-title-span">Experience</span></h2>
      <div class="blog-grid">
        <!-- Work cards will be injected here -->
      </div>
    </div>
  </section>

    <section class="filter-section">
    <div class="head-section"  id="filter-section">
      <h2 class="filter-item active" data-category="mobileapp">Mobile App</h2>
      <h2 class="filter-item" data-category="webapp">Web App</h2>
      <h2 class="filter-item " data-category="website">Website</h2>
      <h2 class="filter-item " data-category="custom">Custom Sas Product</h2>

      </div>
    </div>
  </section>
    <script>
  const filterItems = document.querySelectorAll('.filter-item');

  filterItems.forEach(item => {
    item.addEventListener('click', () => {
      // Remove active from all
      filterItems.forEach(i => i.classList.remove('active'));
      
      // Add active to clicked
      item.classList.add('active');

    
      const selected = item.textContent.trim();
      console.log("Selected:", selected);

      // Example: you can call your filtering logic here
      // filterWorks(selected);
    });
  });
</script>

<section class="works" id="work-container">
</section>
