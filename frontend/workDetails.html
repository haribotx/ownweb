<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botx Automations</title>
      <style>
     html, body {
    background-color: #000;
    color: #fff;
    margin: 0;
    padding: 0;
  }
  </style>
    <link rel="stylesheet" href="workDetals.css">
    <link rel="icon" type="image/png" href="../images/logo.png" />
  <link rel="icon" type="image/png" href="/frontend/images/logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
      <header>
    <div id="header-placeholder"></div>
  </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-subtitle">/Work details</h1>
                 
            </div>
        </div>
    </section>

    <!-- Filter Section -->
    <section class="filter-section">
        <div class="container">
            
        </div>
    </section>

    <!-- Animated Text Section -->
    <section class="animated-text-section">
        <div class="animated-text-container">
            <h2 class="animated-text">
                <span class="text-line">
                    <span class="text-word">BEYOND</span>
                    <span class="text-word">THE</span>
                </span>
                <span class="text-line">
                    <span class="text-word">SCREEN</span>
                </span>
            </h2>
        </div>
    </section>

    <!-- Image Section -->
    <section class="image-section">
        <div class="image-container">
            <img src="../images/calva m.png" alt="Calva Project" class="project-image">
            <span class="plus-icon plus-top-left" aria-hidden="true"></span>
            <span class="plus-icon plus-top-right" aria-hidden="true"></span>
            <span class="plus-icon plus-bottom-left" aria-hidden="true"></span>
            <span class="plus-icon plus-bottom-right" aria-hidden="true"></span>
        </div>
    </section>

    <!-- Overview Section -->
    <section class="overview-section">
        <div class="overview-container">
            <!-- <div class="overview-left">
                <h1 class="overview-title">OVERVIEW</h1>
                <h2 class="overview-subtitle">OV</h2>
                <div class="dynamic-graphic">
                    <div class="graphic-wave"></div>
                    <div class="graphic-particles">
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                    </div>
                </div>
            </div> -->
          
          <div>
            <p class="overview-title">overview </p>
          </div>
          
            
          <div>
            <p class="overview-subtitle">ov </p>
          </div>
          
          
          
            <div class="overview-right">
                <div class="project-description">
                    
                    <p class="description-text">
                        
                    </p>
                    
                </div>
                <div class="project-details">
                    <div class="detail-row">
                        <span class="detail-label">Year</span>
                        <span class="detail-value"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Client</span>
                        <span class="detail-value"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Services</span>
                        <span class="detail-value"></span>
                    </div>
                </div>
                <button class="download-btn">Download case study</button>
            </div>
        </div>
    </section>

    <!-- Project Details Section (MOVED DOWN) -->
    <section class="project-details-section">
        <div class="project-details-container">
            <div class="project-card-luximatch">
                <div class="card-visual-area">
                    <div class="card-background-image">
                        <img src="" alt="Luximatch Background" class="background-img">
                    </div>
                    <span class="plus-icon plus-top-left" aria-hidden="true"></span>
                    <span class="plus-icon plus-top-right" aria-hidden="true"></span>
                    <span class="plus-icon plus-bottom-left" aria-hidden="true"></span>
                    <span class="plus-icon plus-bottom-right" aria-hidden="true"></span>
                </div>
                <div class="card-details-area">
                    <div class="project-info">
                        <p class="selected-work-label">Selected work</p>
                        <h3 class="project-name"></h3>
                        <div class="detail-item">
                            <span class="detail-label">Client</span>
                            <span class="detail-value"></span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Type</span>
                            <span class="detail-value"></span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Role</span>
                            <span class="detail-value"></span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Completed</span>
                            <span class="detail-value"></span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Second Project Card - Calva (Opposite Design) -->
            <div class="project-card-calva">
                <div class="card-details-area">
                    <div class="project-info">
                        <p class="selected-work-label">Selected work</p>
                        <h3 class="project-name"></h3>
                        <div class="detail-item">
                            <span class="detail-label">Client</span>
                            <span class="detail-value"></span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Type</span>
                            <span class="detail-value"></span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Role</span>
                            <span class="detail-value"></span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Completed</span>
                            <span class="detail-value"></span>
                        </div>
                    </div>
                </div>
                <div class="card-visual-area">
                    <div class="card-background-image">
                        <img src="" alt="Calva Background" class="background-img">
                    </div>
                    <span class="plus-icon plus-top-left" aria-hidden="true"></span>
                    <span class="plus-icon plus-top-right" aria-hidden="true"></span>
                    <span class="plus-icon plus-bottom-left" aria-hidden="true"></span>
                    <span class="plus-icon plus-bottom-right" aria-hidden="true"></span>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
     

    <!-- Background Lines -->
    <div class="background-lines">
        <div class="bg-line line-1"></div>
        <div class="bg-line line-2"></div>
        <div class="bg-line line-3"></div>
        <div class="bg-line line-4"></div>
        <div class="bg-line line-5"></div>
    </div>

    <!-- Background Particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
<div id="footer-placeholder"></div>

 <script src="includeHeader.js"></script>
 <script src="./includeFooter.js"></script>
      <script src="config.js"></script>
    <script src="workDetails.js"></script>
</body>
</html>
