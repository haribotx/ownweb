<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Botx Automations</title>
      <style>
     html, body {
    background-color: #000;
    color: #fff;
    margin: 0;
    padding: 0;
  }
  </style>
    <link rel="stylesheet" href="contact.css" />
    <link rel="icon" type="image/png" href="/frontend/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Background Lines -->
    <div class="background-lines">
      <div class="bg-line line-1"></div>
      <div class="bg-line line-2"></div>
      <div class="bg-line line-3"></div>
      <div class="bg-line line-4"></div>
      <div class="bg-line line-5"></div>
    </div>

    <!-- Navbar -->
    <header>
      <div id="header-placeholder"></div>
    </header>

    <div id="toast" class="toast"></div>

     <!-- Animated Text Section -->
     <section class="animated-text-section">
      <div class="animated-text-container">
        <h2 class="animated-text">
          <span class="text-line">
            <span class="text-word">LET'S</span>
            <span class="text-word">TALK</span>
          </span>             
        </h2>
      </div>
    </section>    
    <section>
      <div class="contact-section">
        <p class="contact-paragraph">
          Have a question? Just for me a line via email or make a WhatsApp cal.
          Iam available for new projects and interesting opportunities
        </p>
      </div>

      <div class="contact-div">
        <p>hr@botx@gmail.com</p>
        <p>+91 8795463212</p>
      </div>

      <div class="contact-grid-container">
        <div class="contact-grid-item-icon">
          <a href="https://www.facebook.com/botxautomations"
     target="_blank"
     rel="noopener noreferrer">
    <i class="fa-brands fa-facebook-f"></i>
  </a>
        </div>
        <div class="contact-grid-item-icon">
         <a href="https://x.com/BotxAutomations?t=No7EfXmETS6RR_q5Qmj6oQ&s=09"
     target="_blank"
     rel="noopener noreferrer">
    <i class="fa-brands fa-x-twitter"></i>
  </a>
        </div>
        <div class="contact-grid-item-icon">
         <a href="https://wa.me/+919496609124"
     target="_blank"
     rel="noopener noreferrer">
    <i class="fa-brands fa-whatsapp"></i>
  </a>
        </div>
        <div class="contact-grid-item-icon">
          <a href="https://www.instagram.com/botxautomations/?igsh=eXZlZzU3Y3N6OHo0#"
     target="_blank"
     rel="noopener noreferrer">
    <i class="fa-brands fa-instagram"></i>
  </a>
        </div>
      </div>
      <section class="animated-text-sectionlast">
        <div class="animated-text-last">
            <h2 class="animated-text-Here">
                <span class="text-line">
                    <span class="texts-word">I'D</span>
                    <span class="texts-word">LOVE</span>
                    <span class="texts-word">TO</span>
                </span>
                <span class="text-line">
                    <span class="texts-word">HERE</span>
                    <span class="texts-word">FROM</span>
                    <span class="texts-word">YOU</span>
                </span>
            </h2>
        </div>
    </section>
      <section class="contact-me">
        <div class="form-container">
          <form id="contactForm">
            <label for="name">Name</label>
            <div class="input-container">
              <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
              />
              <div class="corner-icon top-left">+</div>
              <div class="corner-icon top-right">+</div>
              <div class="corner-icon bottom-left">+</div>
              <div class="corner-icon bottom-right">+</div>
            </div>
            <label for="email">Email</label>
            <div class="input-container">
              <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
              />
              <div class="corner-icon top-left">+</div>
              <div class="corner-icon top-right">+</div>
              <div class="corner-icon bottom-left">+</div>
              <div class="corner-icon bottom-right">+</div>
            </div>
            <label for="message">Message</label>
            <div class="input-container">
              <textarea
                id="message"
                rows="5"
                placeholder="Enter your message"
                required
              ></textarea>
              <div class="corner-icon top-left">+</div>
              <div class="corner-icon top-right">+</div>
              <div class="corner-icon bottom-left">+</div>
              <div class="corner-icon bottom-right">+</div>
            </div>
            <button type="submit" class="btn">SEND MESSAGE</button>
          </form>
        </div>
      </section>
    </section>

    <div id="footer-placeholder"></div>

    <script src="./includeHeader.js"></script>
    <script src="./includeFooter.js"></script>
    <script src="config.js"></script>
    <script src="contact.js"></script>
  </body>
</html>
