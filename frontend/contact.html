<!-- blog.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Botx Website</title>
  <link rel="stylesheet" href="contact.css" />
  <link rel="icon" type="image/png" href="/frontend/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">


</head>
<body>
  <!-- Navbar -->
  <header>
    <!-- your existing Webflow navbar code -->
  </header>

  <section>
  <div class="contact-section">
    <p class="contact-paragraph">Have a question? Just for me a line via email or make a WhatsApp cal. Iam available for new projects and interesting opportunities</p>

  </div>

  <div class="contact-div">
  <p>hr@botx@gmail.com</p>
<p>+91 8795463212</p>
</div>

  <div class="grid-container">
        <!-- Row 1 -->
           <div class="grid-item-icon">
            <!-- Facebook -->
            <svg class="icon icon-facebook" viewBox="0 0 24 24">
                <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
            </svg>
        </div>
     

        <!-- Row 2 -->
        <div class="grid-item-icon">
            <!-- X (Twitter) -->
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M4 4l11.733 16L20 20M4 20l16-16" stroke-linecap="round"/>
            </svg>
        </div>

          <div class="grid-item-icon">
            <!-- Dribbble -->
            <svg class="icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/>
                <path d="M19.13 5.09C15.22 9.14 10 10.44 2.25 10.94"/>
                <path d="M21.75 12.84c-6.62-1.93-12.23-1.93-17.48.05"/>
                <path d="M8.56 2.75c4.37 6 6 9.42 6.84 17.5"/>
            </svg>
        </div>
      

        <!-- Row 3 -->
        <div class="grid-item-icon">
            <!-- Instagram -->
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                <circle cx="12" cy="12" r="4"/>
                <circle cx="17.5" cy="6.5" r="1" fill="#fff"/>
            </svg>
        </div>
    </div>

     <section class="contact-me">
    <div class="form-container">
      <form>

        <label for="name">Name</label>
      <div class="input-wrapper">
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Enter your message" required></textarea>

        <button type="submit" class="btn">SEND MESSAGE</button>
      </form>
    </div>
    </section>
</section>
  </body>
  </html>
